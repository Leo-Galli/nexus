<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8183f4"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- GNOME-style rounded-square background tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>

  <!-- Connecting lines forming a small network -->
  <g stroke="#e0e1fb" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="64" y1="40" x2="40" y2="68"/>
    <line x1="64" y1="40" x2="88" y2="68"/>
    <line x1="40" y1="68" x2="64" y2="92"/>
    <line x1="88" y1="68" x2="64" y2="92"/>
    <line x1="40" y1="68" x2="88" y2="68"/>
  </g>

  <!-- Hub node (center top) -->
  <circle cx="64" cy="40" r="12" fill="#ffffff"/>
  <!-- Peer nodes -->
  <circle cx="40" cy="68" r="9" fill="#c7c9fb"/>
  <circle cx="88" cy="68" r="9" fill="#c7c9fb"/>
  <circle cx="64" cy="92" r="9" fill="#ffffff"/>
</svg>
