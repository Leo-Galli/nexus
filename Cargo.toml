[workspace]
resolver = "2"
members = [
    "crates/nexus-core",
    "crates/nexus-secrets",
    "crates/nexus-store",
    "crates/nexus-providers",
    "crates/nexus-cli-agents",
    "crates/nexus-automation",
    "crates/nexus-stats",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/GITHUB_OWNER/nexus"

# Shared dependency versions. Bump deliberately; flatpak-cargo-generator
# needs a regenerated cargo-sources.json after any version change here.
[workspace.dependencies]
nexus-core = { path = "crates/nexus-core" }
nexus-secrets = { path = "crates/nexus-secrets" }
nexus-store = { path = "crates/nexus-store" }
nexus-providers = { path = "crates/nexus-providers" }
nexus-cli-agents = { path = "crates/nexus-cli-agents" }
nexus-automation = { path = "crates/nexus-automation" }
nexus-stats = { path = "crates/nexus-stats" }

tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
futures-core = "0.3"
futures-util = "0.3"
async-trait = "0.1"
async-channel = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
oo7 = { version = "0.3", default-features = false, features = ["tokio", "native_crypto"] }
toml = "0.8"
cron = "0.12"
which = "6.0"
regex = "1.10"

[workspace.dependencies.wiremock]
version = "0.6"

[workspace.dependencies.tempfile]
version = "3.12"

[workspace.dependencies.notify]
version = "6.1"

[workspace.dependencies.csv]
version = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev]
opt-level = 0

# The workspace root is also the main application package (same layout as
# GNOME apps such as Fractal/Shortwave): the binary lives in src/, the
# reusable logic lives in crates/*.
[package]
name = "nexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nexus"
path = "src/main.rs"

[dependencies]
nexus-core.workspace = true
nexus-secrets.workspace = true
nexus-store.workspace = true
nexus-providers.workspace = true
nexus-cli-agents.workspace = true
nexus-automation.workspace = true
nexus-stats.workspace = true

tokio.workspace = true
async-channel.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true

# GNOME Rust bindings. Feature flags select the minimum GNOME platform
# version Nexus targets; bump together with the Flatpak runtime version
# in build-aux/flatpak/*.json.
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
gio = { version = "0.20", features = ["v2_80"] }
glib = { version = "0.20" }
vte = { version = "0.9", package = "vte4" }

